<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Checkout Test Harness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Razorpay Standard Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div class="border-b border-slate-100 pb-5 mb-6">
            <span class="text-xs uppercase font-bold tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">Test Environment</span>
            <h1 class="text-2xl font-black text-slate-800 mt-2">Make a Campaign Donation</h1>
            <p class="text-sm text-slate-500 mt-1">Live Razorpay Order Initiation & Cryptographic Signature Verification</p>
        </div>

        <form id="donationForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">API Base URL</label>
                <input type="url" id="apiBaseUrl" value="http://localhost:8080" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Campaign UUID</label>
                <input type="text" id="campaignId" placeholder="e.g. 3fa85f64-5717-4562-b3fc-2c963f66afa6" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Amount (INR ₹)</label>
                    <input type="number" id="amount" value="500.00" min="1.00" step="1.00" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Donor Name</label>
                    <input type="text" id="donorName" value="Alex Morgan" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Donor Email</label>
                <input type="email" id="donorEmail" value="alex@example.com" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="isAnonymous" class="w-4 h-4 text-indigo-600 rounded border-slate-300">
                <label for="isAnonymous" class="text-sm text-slate-600 font-medium">Donate anonymously</label>
            </div>

            <button type="button" id="donateBtn" onclick="initiateDonation()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-md shadow-indigo-100">
                <span>Proceed to Pay with Razorpay</span>
            </button>
        </form>

        <div id="statusContainer" class="mt-6 hidden">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Transaction Status</h3>
            <div id="statusMessage" class="text-sm p-4 rounded-xl"></div>
            <pre id="statusDebug" class="mt-2 p-3 bg-slate-900 text-slate-200 text-xs rounded-lg overflow-x-auto max-h-48"></pre>
        </div>
    </div>

    <script>
        async function initiateDonation() {
            const apiBase = document.getElementById('apiBaseUrl').value.replace(/\/+$/, '');
            const campaignId = document.getElementById('campaignId').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const donorName = document.getElementById('donorName').value.trim();
            const donorEmail = document.getElementById('donorEmail').value.trim();
            const isAnonymous = document.getElementById('isAnonymous').checked;

            const btn = document.getElementById('donateBtn');
            const statusContainer = document.getElementById('statusContainer');
            const statusMessage = document.getElementById('statusMessage');
            const statusDebug = document.getElementById('statusDebug');

            if (!campaignId) {
                alert("Please provide a valid Campaign UUID.");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white inline-block mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Processing Order...`;
                statusContainer.classList.remove('hidden');
                statusMessage.className = "text-sm p-4 rounded-xl bg-blue-50 text-blue-700 border border-blue-200";
                statusMessage.innerText = "Creating order on backend via Razorpay Orders API...";
                statusDebug.innerText = "";

                // STEP 1: Request Razorpay Order ID from backend
                const orderPayload = {
                    campaignId: campaignId,
                    amount: amount,
                    donorName: donorName,
                    donorEmail: donorEmail,
                    isAnonymous: isAnonymous
                };

                const orderResponse = await fetch(`${apiBase}/api/v1/donations/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });

                const orderResult = await orderResponse.json();

                if (!orderResponse.ok || !orderResult.success) {
                    throw new Error(orderResult.message || "Failed to create order on server.");
                }

                const orderData = orderResult.data;
                statusMessage.innerText = `Order created (${orderData.razorpayOrderId}). Launching Razorpay checkout popup...`;
                statusDebug.innerText = JSON.stringify(orderData, null, 2);

                // STEP 2: Configure & Open Razorpay Checkout Modal
                const options = {
                    key: orderData.keyId,
                    amount: Math.round(orderData.amount * 100), // In paise
                    currency: orderData.currency,
                    name: "Donation Platform",
                    description: `Support Campaign #${campaignId.substring(0, 8)}`,
                    order_id: orderData.razorpayOrderId,
                    handler: async function (checkoutCallback) {
                        // STEP 3: Cryptographic Signature Handoff to Backend
                        statusMessage.className = "text-sm p-4 rounded-xl bg-yellow-50 text-yellow-800 border border-yellow-200";
                        statusMessage.innerText = "Payment completed in popup. Cryptographically verifying signature on backend...";
                        
                        try {
                            const verifyPayload = {
                                razorpayOrderId: checkoutCallback.razorpay_order_id,
                                razorpayPaymentId: checkoutCallback.razorpay_payment_id,
                                razorpaySignature: checkoutCallback.razorpay_signature
                            };

                            const verifyResponse = await fetch(`${apiBase}/api/v1/donations/verify`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(verifyPayload)
                            });

                            const verifyResult = await verifyResponse.json();

                            if (!verifyResponse.ok || !verifyResult.success) {
                                throw new Error(verifyResult.message || "Cryptographic signature verification rejected.");
                            }

                            statusMessage.className = "text-sm p-4 rounded-xl bg-green-50 text-green-800 border border-green-200";
                            statusMessage.innerText = `Payment Verified Successfully! Donation ID: ${verifyResult.data.id}. Campaign total updated!`;
                            statusDebug.innerText = JSON.stringify(verifyResult.data, null, 2);
                        } catch (err) {
                            statusMessage.className = "text-sm p-4 rounded-xl bg-red-50 text-red-800 border border-red-200";
                            statusMessage.innerText = `Verification Failed: ${err.message}`;
                        } finally {
                            btn.disabled = false;
                            btn.innerText = "Proceed to Pay with Razorpay";
                        }
                    },
                    prefill: {
                        name: isAnonymous ? "" : donorName,
                        email: isAnonymous ? "" : donorEmail
                    },
                    theme: {
                        color: "#4F46E5"
                    },
                    modal: {
                        ondismiss: function () {
                            btn.disabled = false;
                            btn.innerText = "Proceed to Pay with Razorpay";
                            statusMessage.className = "text-sm p-4 rounded-xl bg-slate-100 text-slate-700";
                            statusMessage.innerText = "Checkout window was dismissed by donor.";
                        }
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();

            } catch (error) {
                statusMessage.className = "text-sm p-4 rounded-xl bg-red-50 text-red-800 border border-red-200";
                statusMessage.innerText = `Error: ${error.message}`;
                statusDebug.innerText = error.stack || "";
                btn.disabled = false;
                btn.innerText = "Proceed to Pay with Razorpay";
            }
        }
    </script>
</body>
</html>
